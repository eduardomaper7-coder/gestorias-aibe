[project]
name = "aibe-gestorias"
version = "0.1.0"
description = "Plataforma multicliente de agentes de IA para gestorías (Aibe Technologies)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "itsdangerous>=2.2",
    "anthropic>=0.40",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.tenancy" = ["plantillas_base/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
